# The Ignis beta sign-up service. Secrets (the invite code, keys, the mailbox password) are set
# with `wrangler secret put …` and never kept in this repo: see README.md.
name = "creatio-aura-beta"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Keep the service's logs (Workers Logs), so problems can be looked into afterwards.
[observability]
enabled = true

[vars]
SITE_URL = "https://creatio-aura.com"
# creatio-aura.github.io forwards to creatio-aura.com now; it stays allowed for pages opened before the move.
ALLOWED_ORIGINS = "https://creatio-aura.com,https://creatio-aura.github.io,https://ignis-aura-play.creatio-aura.workers.dev"
SERVICE_URL = "https://creatio-aura-beta.creatio-aura.workers.dev"
# Emails go out through IONOS, signed in as the support mailbox (its password: the SMTP_PASSWORD
# secret), so they come from support@creatio-aura.com and replies land there.
SMTP_HOST = "smtp.ionos.com"
SMTP_USER = "support@creatio-aura.com"
OWNER_EMAIL = "creatio.aura@gmail.com"
MAIL_MODE = "smtp"

# The daily beta report, every morning: 14:00 UTC is 8 am in Colorado in summer, 7 am in winter.
[triggers]
crons = ["0 14 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "creatio-aura-beta"
database_id = "25bd6917-afe2-4344-a6d1-9ebe21fc3ed2"
migrations_dir = "migrations"
