name: security.txt date

# site/.well-known/security.txt stops being trusted after its Expires date, so it has to be moved on
# (at most a year ahead) before then. Once a month, and whenever the file changes, this fails if the
# date is less than 60 days away, so GitHub emails the failure in good time.
# GitHub pauses scheduled runs in a public repo after 60 days without commits: if it does, turn
# this back on from the Actions tab.
on:
  schedule:
    - cron: "0 15 1 * *"
  pull_request:
    paths: ["site/.well-known/security.txt", ".github/workflows/security-txt.yml"]
  push:
    branches: [main]
    paths: ["site/.well-known/security.txt", ".github/workflows/security-txt.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expires:
    name: security.txt date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/check-security-txt.py site/.well-known/security.txt
