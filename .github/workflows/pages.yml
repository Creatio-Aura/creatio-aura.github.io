name: Publish the website

# Publishes site/ to GitHub Pages (https://creatio-aura.com) whenever main changes, with the Journal
# (journal/posts/*.md) built into it by tools/journal/build.mjs.
on:
  push:
    branches: [main]
    paths: ["site/**", "journal/**", "tools/journal/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, so the IndexNow step can see which posts this push changed
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tools/journal/package-lock.json
      - name: Check the Journal's posts
        working-directory: tools/journal
        run: npm ci && node check.mjs
      - name: Build the site with the Journal
        working-directory: tools/journal
        run: node build.mjs --out ../../_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Bing (IndexNow) hears about new or changed Journal posts as soon as they're live. Never fails the publish.
      - name: Tell Bing about new Journal posts
        if: github.event_name == 'push'
        continue-on-error: true
        working-directory: tools/journal
        env:
          BEFORE: ${{ github.event.before }}
        run: node indexnow.mjs "$BEFORE" "$GITHUB_SHA"
